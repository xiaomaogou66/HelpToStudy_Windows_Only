name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号（如 v1.0.0）；留空则按当前日期自动生成"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release assets
        id: build
        shell: pwsh
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          $tag = $env:TAG_INPUT
          if (-not $tag) {
            if ($env:GITHUB_REF_TYPE -eq "tag") { $tag = $env:GITHUB_REF_NAME }
            else { $tag = "v" + (Get-Date -Format "yyyy.MM.dd") }
          }
          $tag = $tag.Trim()
          if ($tag -notmatch '^v[0-9A-Za-z._-]+$') { throw "Invalid tag: $tag" }
          $outDir = Join-Path $env:RUNNER_TEMP "release"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          & .\scripts\build-release.ps1 -Tag $tag -Repo $env:GITHUB_REPOSITORY -OutDir $outDir
          Set-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag" -Encoding ascii
          # 脚本内的 robocopy 成功退出码为 1，runner 会在脚本末尾隐式 exit $LASTEXITCODE，
          # 必须显式 exit 0 避免被误判为失败。
          exit 0

      - name: 校验资产（三个包的内容 + 三个引导器的行尾）
        shell: pwsh
        run: |
          $tag = "${{ steps.build.outputs.tag }}"
          $outDir = Join-Path $env:RUNNER_TEMP "release"
          $full  = "HelpToStudy-Vault-$tag.zip"
          $learn = "HelpToStudy-Learn-Vault-$tag.zip"
          $sched = "HelpToStudy-Schedule-Vault-$tag.zip"
          foreach ($n in @($full, $learn, $sched,
                           "HelpToStudy-QuickInstall.bat", "HelpToStudy-Learn-QuickInstall.bat",
                           "HelpToStudy-Schedule-QuickInstall.bat", "release-notes.md")) {
            if (-not (Test-Path -LiteralPath (Join-Path $outDir $n))) { throw "缺少资产：$n" }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Get-ZipNames([string]$p) {
            $z = [System.IO.Compression.ZipFile]::OpenRead($p)
            try { return @($z.Entries | ForEach-Object { $_.FullName }) } finally { $z.Dispose() }
          }
          function Assert-Has([string[]]$names, [string]$needle, [string]$who) {
            if (-not ($names | Where-Object { $_ -eq $needle })) { throw "$who 缺少 $needle" }
          }
          function Assert-No([string[]]$names, [string]$prefix, [string]$who) {
            $hit = $names | Where-Object { $_.StartsWith($prefix) } | Select-Object -First 1
            if ($hit) { throw "$who 不该包含 $hit" }
          }
          $nFull  = Get-ZipNames (Join-Path $outDir $full)
          $nLearn = Get-ZipNames (Join-Path $outDir $learn)
          $nSched = Get-ZipNames (Join-Path $outDir $sched)
          # 全量：两部分都在
          foreach ($need in @("install.ps1", "QuickInstall.ps1", "_工具/拆书.bat",
                              ".claude/commands/拆书.md", ".claude/commands/周决策.md",
                              "05-日程安排/_脚本/自检.bat")) { Assert-Has $nFull $need "全量包" }
          # 学习版：只有学习部分
          foreach ($need in @("install.ps1", "_工具/拆书.bat", ".claude/commands/拆书.md")) {
            Assert-Has $nLearn $need "学习版"
          }
          Assert-No $nLearn "05-日程安排/" "学习版"
          foreach ($no in @(".claude/commands/周决策.md", ".claude/commands/课表.md",
                            ".pi/skills/zhou-jue-ce.md", ".pi/skills/ke-biao.md")) {
            if ($nLearn -contains $no) { throw "学习版不该带 $no" }
          }
          # 日程版：只有日程安排层 + 安装器
          foreach ($need in @("install.ps1", "05-日程安排/_脚本/自检.bat",
                              ".claude/commands/周决策.md", ".pi/skills/zhou-jue-ce.md")) {
            Assert-Has $nSched $need "日程版"
          }
          foreach ($no in @("01-提示词库/", "02-模板/", "03-学习主题/", "04-教材分块/", "_工具/")) {
            Assert-No $nSched $no "日程版"
          }
          # 引导器：必须 CRLF（cmd 下裸 LF 会报错）+ 含 -Part
          foreach ($b in Get-ChildItem -LiteralPath $outDir -Filter *.bat -File) {
            $bytes = [IO.File]::ReadAllBytes($b.FullName)
            $lf = 0
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 10 -and ($i -eq 0 -or $bytes[$i-1] -ne 13)) { $lf++ }
            }
            if ($lf -gt 0) { throw "$($b.Name) 存在裸 LF" }
            $text = [IO.File]::ReadAllText($b.FullName, [Text.Encoding]::ASCII)
            if ($text -notmatch 'set "PART=(all|learn|schedule)"') { throw "$($b.Name) 没带 -Part" }
            if ($text -notmatch "-Part %PART%") { throw "$($b.Name) 没把 -Part 传给安装器" }
            Write-Host "OK  $($b.Name)  CRLF / -Part"
          }
          Write-Host "三个包的内容与三个引导器都校验通过"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.build.outputs.tag }}"
          $repo = "$env:GITHUB_REPOSITORY"
          $outDir = Join-Path $env:RUNNER_TEMP "release"
          $assets = @(Get-ChildItem -LiteralPath $outDir -File |
                      Where-Object { $_.Name -ne "release-notes.md" } |
                      Select-Object -ExpandProperty FullName)
          # 本仓库开了「不可变 Release」：发布后的资产不能再上传/替换，所以固定走
          # 「建草稿 → 传资产 → 发布」；要更新就先把旧 Release 删掉再重建（tag 保留）。
          $exists = $false
          try {
            gh release view "$tag" --repo $repo *> $null
            $exists = ($LASTEXITCODE -eq 0)
          } catch {
            $exists = $false
          }
          if ($exists) {
            Write-Host "Release $tag 已存在：删除后重建（不可变 Release 的资产改不了；tag 保留）"
            gh release delete "$tag" --yes --repo $repo
            if ($LASTEXITCODE -ne 0) { throw "删除旧 Release 失败" }
          }
          gh release create "$tag" --draft --repo $repo `
            --title "AI 学习工作流 $tag" --notes-file (Join-Path $outDir "release-notes.md")
          if ($LASTEXITCODE -ne 0) { throw "创建草稿 Release 失败" }
          gh release upload "$tag" @assets --repo $repo
          if ($LASTEXITCODE -ne 0) { throw "上传资产失败" }
          gh release edit "$tag" --draft=false --repo $repo
          if ($LASTEXITCODE -ne 0) { throw "发布 Release 失败" }
          gh release view "$tag" --repo $repo

  # 只报告、不卡发布：CI 里没有真机桌面，但 Python 层与仓库内容能查
  smoke:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 语法检查（全部 .py）
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.py -File | ForEach-Object {
            & python -m py_compile $_.FullName
            if ($LASTEXITCODE -ne 0) { $bad = 1; Write-Host "FAILED: $($_.FullName)" }
          }
          if ($bad -ne 0) { throw "有 Python 文件语法错误" }
          Write-Host "所有 .py 语法检查通过"

      - name: 仓库内容检查（不该出现的文件）
        shell: pwsh
        run: |
          $bad = @()
          $bad += Get-ChildItem -Recurse -File -Include *.ics,*.ical |
                  Where-Object { $_.Name -notin @('课表示例.ics','日程安排.ics') }
          $bad += Get-ChildItem -Recurse -File -Include calender-*.json,service-account*.json,token.json
          $bad += Get-ChildItem -Recurse -Directory -Filter "20??-W*"
          if ($bad) { $bad | ForEach-Object { Write-Host "BAD: $($_.FullName)" }; throw "仓库里出现不该包含的文件" }
          Write-Host "OK  没有密钥 / 个人课表 / 个人日记"
      - name: 安装最小依赖（tzdata：Windows 的 ZoneInfo 需要）
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check tzdata
          Write-Host "tzdata 已安装"

      - name: 日程安排层自检（离线）
        shell: pwsh
        run: |
          & python "05-日程安排\_脚本\自检.py"
          if ($LASTEXITCODE -ne 0) { throw "自检未通过（见上面 ❌）" }

      - name: 启动器检查（.bat 行尾 + 关键文件存在）
        shell: pwsh
        run: |
          $bats = Get-ChildItem -Recurse -Include *.bat -File
          foreach ($f in $bats) {
            $bytes = [IO.File]::ReadAllBytes($f.FullName)
            $crlf = 0; $lf = 0
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 10) { if ($i -gt 0 -and $bytes[$i-1] -eq 13) { $crlf++ } else { $lf++ } }
            }
            if ($lf -gt 0) { throw "$($f.Name) 存在裸 LF（.bat 必须 CRLF）" }
            Write-Host "OK  $($f.Name)  CRLF=$crlf"
          }
          foreach ($must in @("_工具\拆书.bat", "05-日程安排\_脚本\同步日程.bat",
                              "05-日程安排\_脚本\自检.bat", "05-日程安排\_脚本\假期块.bat",
                              "05-日程安排\_脚本\更新节假日.bat", "05-日程安排\00-配置\多端同步.md")) {
            if (-not (Test-Path -LiteralPath $must)) { throw "缺少 $must" }
          }
          Write-Host "关键启动器与文档齐备"


      - name: 分部安装（学习版 / 日程版）
        shell: pwsh
        run: |
          # -SkipPython 是为了跑得快；robocopy 成功也会留下退出码 1，
          # 所以不校验退出码，直接校验「装出来的东西对不对」。
          $learn = Join-Path $env:RUNNER_TEMP "smoke-learn"
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 `
              -Part learn -VaultPath $learn -NoDialog -SkipPython -Force
          if (-not (Test-Path -LiteralPath (Join-Path $learn "00-使用指南\📖 使用说明.md"))) { throw "学习版缺 00-使用指南" }
          if (-not (Test-Path -LiteralPath (Join-Path $learn "_工具\拆书.bat"))) { throw "学习版缺拆书启动器" }
          if (-not (Test-Path -LiteralPath (Join-Path $learn ".claude\commands\拆书.md"))) { throw "学习版缺 /拆书" }
          if (Test-Path -LiteralPath (Join-Path $learn "05-日程安排")) { throw "学习版不该带 05-日程安排" }
          if (Test-Path -LiteralPath (Join-Path $learn ".claude\commands\周决策.md")) { throw "学习版不该带 /周决策" }
          Write-Host "OK  学习版装出来是对的"

          $sched = Join-Path $env:RUNNER_TEMP "smoke-schedule"
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 `
              -Part schedule -VaultPath $sched -NoDialog -SkipPython -Force
          if (-not (Test-Path -LiteralPath (Join-Path $sched "05-日程安排\_脚本\自检.bat"))) { throw "日程版缺自检.bat" }
          if (-not (Test-Path -LiteralPath (Join-Path $sched "05-日程安排\00-配置\多端同步.md"))) { throw "日程版缺 00-配置" }
          if (-not (Test-Path -LiteralPath (Join-Path $sched ".claude\commands\周决策.md"))) { throw "日程版缺 /周决策" }
          if (-not (Test-Path -LiteralPath (Join-Path $sched ".pi\skills\zhou-jue-ce.md"))) { throw "日程版缺周决策 skill" }
          if (Test-Path -LiteralPath (Join-Path $sched "01-提示词库")) { throw "日程版不该带学习部分" }
          Write-Host "OK  日程版只装第六层，学习部分没被动"

          # 日程版叠进学习版库：第二轮不该动学习内容
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 `
              -Part schedule -VaultPath $learn -NoDialog -SkipPython -Force
          if (-not (Test-Path -LiteralPath (Join-Path $learn "05-日程安排\_脚本\自检.bat"))) { throw "叠加装日程层失败" }
          if (-not (Test-Path -LiteralPath (Join-Path $learn "00-使用指南\📖 使用说明.md"))) { throw "叠加后学习内容不见了" }
          Write-Host "OK  日程版可以后装进学习版库"
